
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diário do Davi Miguel</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;800&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--azul:#2f6fb5;--escuro:#1d3f6e;--claro:#e8f2fc;--ceu:#cfe4f7;--sol:#f5c542;--card:#fff;--suave:#5f7f9f}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--escuro);line-height:1.5;
background:linear-gradient(180deg,#d9eafa 0,#eef6fd 45%,#fff 100%) fixed;min-height:100vh}
.topo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.marca{font-family:Pacifico,cursive;font-size:1.35rem;color:var(--escuro);display:flex;align-items:center;gap:6px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;font:600 .95rem Nunito,sans-serif;color:var(--escuro);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--claro);color:var(--azul)}
button:focus-visible{outline:3px solid var(--escuro);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:20px 16px 56px}
.pag{display:none}.pag.on{display:block}
h1,h2{font-family:Pacifico,cursive;font-weight:400;margin:0}
.hero{display:grid;gap:24px;align-items:center;margin-top:8px}
@media(min-width:760px){.hero{grid-template-columns:1fr 1fr}}
.polaroid{background:#fff;padding:10px;border-radius:6px;box-shadow:0 6px 20px rgba(29,63,110,.2);transform:rotate(-3deg);max-width:340px;margin:0 auto}
.foto{width:100%;aspect-ratio:1;background:var(--ceu);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;color:var(--suave);padding:8px}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-size:clamp(2.3rem,9vw,3.6rem);line-height:1.1;color:var(--escuro)}
.frase{font-family:Caveat,cursive;font-size:1.7rem;margin:8px 0 16px;color:var(--azul)}
.infos{display:flex;gap:10px;flex-wrap:wrap}
.info{background:var(--card);border-radius:14px;padding:10px 14px;text-align:center;box-shadow:0 3px 10px rgba(29,63,110,.12);min-width:104px}
.info b{display:block;font-size:.9rem}.info span{font-size:.85rem;color:var(--suave)}
.pilula{display:inline-block;margin-top:18px;background:var(--azul);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600}
.titulo{text-align:center;margin:8px 0 18px}.titulo h2{font-size:1.9rem}.titulo p{margin:4px 0 0;color:var(--suave)}
.filtros{display:flex;gap:8px;overflow-x:auto;justify-content:flex-start;padding-bottom:6px;margin-bottom:14px}
@media(min-width:640px){.filtros{justify-content:center}}
.filtros button{border:0;background:#fff;color:var(--escuro);font:600 .9rem Nunito,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(29,63,110,.12);white-space:nowrap}
.filtros button.on{background:var(--azul);color:#fff}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grade{grid-template-columns:repeat(4,1fr)}}
.item{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(29,63,110,.18);text-align:left}
.item .foto{border-radius:0;aspect-ratio:3/4}
.item .tag{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;font-size:.78rem;font-weight:800}
.vazio{text-align:center;color:var(--suave);padding:24px}
.linha{display:flex;gap:6px;overflow-x:auto;padding:10px 4px 18px;position:relative}
.linha::before{content:"";position:absolute;left:0;right:0;top:44px;height:3px;background:var(--ceu)}
.marco{flex:0 0 120px;text-align:center;position:relative}
.marco .bola{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--ceu);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.marco b{display:block;font-size:.92rem}.marco small{color:var(--suave)}
.momentos{display:grid;gap:12px;grid-template-columns:1fr}
