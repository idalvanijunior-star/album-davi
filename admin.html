<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>Painel do Davi Miguel</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

<style>
:root {
  --azul:#2f6fb5;
  --escuro:#1d3f6e;
  --ceu:#cfe4f7;
  --suave:#5f7f9f;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Nunito,sans-serif;
  color:var(--escuro);
  background:linear-gradient(180deg,#d9eafa,#f4f9fe);
  min-height:100vh;
  padding:20px 14px 48px;
}

.caixa {
  max-width:460px;
  margin:0 auto 16px;
  background:white;
  border-radius:18px;
  padding:22px 20px;
  box-shadow:0 6px 20px #1d3f6e29;
}

h1 {
  font-family:Pacifico,cursive;
  font-weight:400;
  font-size:1.6rem;
  margin:0 0 4px;
}

h2 {
  font-size:1.1rem;
  margin:0 0 12px;
}

.sub {
  text-align:center;
  color:var(--suave);
  margin:0 0 16px;
}

label {
  display:block;
  font-weight:800;
  margin:12px 0 4px;
}

input,select {
  width:100%;
  font:inherit;
  padding:10px 12px;
  border:2px solid var(--ceu);
  border-radius:10px;
  background:white;
  color:var(--escuro);
}

.btn {
  width:100%;
  margin-top:16px;
  border:0;
  background:var(--azul);
  color:white;
  font:800 1rem Nunito;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.btn:disabled {
  opacity:.6;
}

.msg {
  margin-top:12px;
  font-weight:600;
  min-height:1.2em;
}

.msg.erro { color:#b3261e; }
.msg.ok { color:#1b7a3d; }

.topo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.topo button {
  border:0;
  background:none;
  color:var(--azul);
  font:800 .9rem Nunito;
  cursor:pointer;
}

.lin {
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid var(--ceu);
}

.lin img {
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
  background:var(--ceu);
}

.lin div {
  flex:1;
  font-size:.9rem;
  min-width:0;
}

.lin small {
  display:block;
  color:var(--suave);
}

.lin button {
  border:0;
  background:none;
  color:#b3261e;
  font:800 .85rem Nunito;
  cursor:pointer;
}

.oculto { display:none; }

#preview {
  width:100%;
  max-height:240px;
  object-fit:contain;
  margin-top:10px;
  border-radius:10px;
  display:none;
  background:#e8f2fc;
}

a { color:var(--azul); }
</style>
</head>

<body>

<div class="caixa oculto" id="semConfig">
  <h1>🧸 Falta configurar</h1>
  <p class="sub">
    Verifique o arquivo config.js.
  </p>
</div>

<div class="caixa oculto" id="login">
  <h1 style="text-align:center">🔒 Painel do Davi</h1>
  <p class="sub">Acesso restrito aos pais</p>

  <form id="fLogin">

    <label for="email">E-mail</label>
    <input id="email" type="email" required>

    <label for="senha">Senha</label>
    <input id="senha" type="password" required>

    <button class="btn" id="bEntrar">
      Entrar
    </button>

    <div class="msg" id="mLogin"></div>
  </form>
</div>

<div class="oculto" id="painel">

  <div class="caixa">

    <div class="topo">
      <h1>📷 Nova foto</h1>
      <button id="sair">Sair</button>
    </div>

    <p class="sub">
      Adicione novas lembranças do Davi! 💙
    </p>

    <form id="fFoto">

      <label for="arq">Escolha a foto</label>
      <input id="arq" type="file" accept="image/*" required>

      <img id="preview" alt="Prévia da foto">

      <label for="secao">Onde deseja publicar?</label>

      <select id="secao" required>
        <option value="galeria">📷 Galeria</option>
        <option value="momentos">⭐ Momentos especiais</option>
      </select>

      <label for="data">Data da foto</label>
      <input id="data" type="date" required>

      <label for="mes">Mês do Davi</label>
      <select id="mes" required></select>

      <label for="leg">Legenda</label>
      <input
        id="leg"
        type="text"
        maxlength="80"
        placeholder="Meu sorriso mais lindo! ❤️"
        required
      >

      <button class="btn" id="bSalvar">
        Salvar foto 💙
      </button>

      <div class="msg" id="mFoto"></div>

    </form>
  </div>

  <div class="caixa">

    <h2>📚 Últimas fotos</h2>

    <div id="lista">Carregando...</div>

    <a href="index.html#galeria"
       style="display:block;text-align:center;margin-top:15px;font-weight:800">
       Ver o diário
    </a>

  </div>

</div>

<script>
var $ = id => document.getElementById(id);

var NASC = "2026-04-29";

var temConfig =
  window.SUPABASE_URL &&
  window.SUPABASE_URL.indexOf("https://") === 0 &&
  window.SUPABASE_KEY &&
  window.SUPABASE_KEY.indexOf("COLE") !== 0;

function msg(el,texto,tipo) {
  el.textContent = texto || "";
  el.className = "msg" + (tipo ? " " + tipo : "");
}

function dataBr(s) {
  return s ? s.split("-").reverse().join("/") : "";
}

function mesDaData(v) {
  var n = new Date(NASC + "T00:00:00");
  var d = new Date(v + "T00:00:00");

  var m = (d.getFullYear()-n.getFullYear())*12
        + d.getMonth()-n.getMonth();

  if(d.getDate() < n.getDate()) m--;

  return Math.min(24,Math.max(1,m));
}

for(var i=1;i<=24;i++) {
  var o = document.createElement("option");
  o.value = i;
  o.textContent = i + "º mês";
  $("mes").appendChild(o);
}

var hoje = new Date();
var ano = hoje.getFullYear();
var mesAtual = String(hoje.getMonth()+1).padStart(2,"0");
var dia = String(hoje.getDate()).padStart(2,"0");

$("data").value = ano + "-" + mesAtual + "-" + dia;
$("mes").value = mesDaData($("data").value);

$("data").onchange = function() {
  if($("data").value) {
    $("mes").value = mesDaData($("data").value);
  }
};

$("arq").onchange = function() {
  var arquivo = this.files[0];

  if(!arquivo) {
    $("preview").style.display = "none";
    return;
  }

  $("preview").src = URL.createObjectURL(arquivo);
  $("preview").style.display = "block";
};

function reduz(file) {
  return new Promise(function(ok,falha) {

    var img = new Image();
    var u = URL.createObjectURL(file);

    img.onload = function() {

      var r = Math.min(1,1600/Math.max(img.width,img.height));

      var c = document.createElement("canvas");
      c.width = Math.round(img.width*r);
      c.height = Math.round(img.height*r);

      c.getContext("2d").drawImage(img,0,0,c.width,c.height);

      URL.revokeObjectURL(u);

      c.toBlob(function(b) {
        b ? ok(b) : falha(new Error("Não consegui preparar a foto."));
      },"image/jpeg",0.85);
    };

    img.onerror = function() {
      URL.revokeObjectURL(u);
      falha(new Error("Não consegui ler essa imagem."));
    };

    img.src = u;
  });
}

function tela(logado) {
  $("login").classList.toggle("oculto",logado);
  $("painel").classList.toggle("oculto",!logado);

  if(logado) carregaLista();
}

if(!temConfig) {

  $("semConfig").classList.remove("oculto");

} else {

  var sb = supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
  );

  sb.auth.getSession().then(function(r) {
    tela(!!r.data.session);
  });

  sb.auth.onAuthStateChange(function(_e,s) {
    tela(!!s);
  });

  $("fLogin").onsubmit = async function(e) {

    e.preventDefault();

    $("bEntrar").disabled = true;
    msg($("mLogin"),"Entrando...");

    var r = await sb.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("senha").value
    });

    $("bEntrar").disabled = false;

    if(r.error) {
      msg($("mLogin"),"E-mail ou senha incorretos.","erro");
    } else {
      msg($("mLogin"),"");
    }
  };

  $("sair").onclick = function() {
    sb.auth.signOut();
  };

  $("fFoto").onsubmit = async function(e) {

    e.preventDefault();

    $("bSalvar").disabled = true;
    msg($("mFoto"),"Enviando foto...");

    var caminho = null;

    try {

      var arquivo = $("arq").files[0];

      if(!arquivo) {
        throw new Error("Escolha uma foto primeiro.");
      }

      var blob = await reduz(arquivo);

      caminho = Date.now() + ".jpg";

      var up = await sb.storage
        .from("fotos")
        .upload(caminho,blob,{
          contentType:"image/jpeg"
        });

      if(up.error) {
        throw new Error("Falha no envio: " + up.error.message);
      }

      var ins = await sb.from("fotos").insert({

        caminho:caminho,

        legenda:$("leg").value.trim(),

        mes:parseInt($("mes").value,10),

        data_foto:$("data").value,

        secao:$("secao").value

      });

      if(ins.error) {

        await sb.storage.from("fotos").remove([caminho]);

        throw new Error("Falha ao salvar no banco: " + ins.error.message);
      }

      msg($("mFoto"),"Foto publicada com sucesso! 💙","ok");

      $("fFoto").reset();
      $("preview").style.display = "none";

      $("data").value = ano + "-" + mesAtual + "-" + dia;
      $("mes").value = mesDaData($("data").value);

      carregaLista();

    } catch(err) {

      msg($("mFoto"),err.message,"erro");

    }

    $("bSalvar").disabled = false;
  };

  async function carregaLista() {

    var r = await sb.from("fotos")
      .select("*")
      .order("criado_em",{ascending:false})
      .limit(30);

    var l = $("lista");
    l.textContent = "";

    if(r.error) {
      l.textContent = "Não consegui carregar as fotos.";
      console.error(r.error);
      return;
    }

    if(!r.data.length) {
      l.textContent = "Nenhuma foto cadastrada.";
      return;
    }

    r.data.forEach(function(f) {

      var d = document.createElement("div");
      d.className = "lin";

      var im = document.createElement("img");

      im.src = sb.storage
        .from("fotos")
        .getPublicUrl(f.caminho).data.publicUrl;

      im.alt = "";

      var t = document.createElement("div");

      t.textContent = f.legenda || "Sem legenda";

      var s = document.createElement("small");

      s.textContent =
        f.mes + "º mês • " +
        dataBr(f.data_foto) + " • " +
        (f.secao === "momentos" ? "⭐ Momentos" : "📷 Galeria");

      t.appendChild(s);

      var b = document.createElement("button");

      b.type = "button";
      b.textContent = "Excluir";

      b.onclick = async function() {

        if(!confirm("Tem certeza que deseja excluir esta foto?")) {
          return;
        }

        b.disabled = true;

        var del = await sb.from("fotos")
          .delete()
          .eq("id",f.id);

        if(del.error) {
          alert("Não foi possível excluir do banco: " + del.error.message);
          b.disabled = false;
          return;
        }

        var rem = await sb.storage
          .from("fotos")
          .remove([f.caminho]);

        if(rem.error) {
          alert("O registro foi excluído, mas o arquivo permaneceu no armazenamento: " + rem.error.message);
        }

        carregaLista();
      };

      d.appendChild(im);
      d.appendChild(t);
      d.appendChild(b);

      l.appendChild(d);
    });
  }
}
</script>

</body>
</html>
